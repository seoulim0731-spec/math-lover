<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 매일 수학 챌린지 🧮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA7O42ev9D6H8PzLMO6qzR1PeSHXM3JDI8",
      authDomain: "math-lover-d4916.firebaseapp.com",
      projectId: "math-lover-d4916",
      storageBucket: "math-lover-d4916.firebasestorage.app",
      messagingSenderId: "343871778182",
      appId: "1:343871778182:web:a69711224013c9c454d007",
      measurementId: "G-N8KR7D374Y"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // 💡 선생님 관리자 비밀번호 (원하는 비밀번호로 변경하세요!)
    const ADMIN_PASSWORD = "1234";

    // 한국 시간(KST) 기준 날짜 구하기 (YYYY-MM-DD)
    const todayStr = new Date().toLocaleDateString('sv-SE');

    // 실시간 불러올 오늘 문제 데이터
    let currentCorrectAnswer = "";
    let officialSolutionUrl = "";

    // 1. Firebase에서 오늘의 문제 & 정답 불러오기
    onSnapshot(doc(db, "settings", "todayProblem"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        currentCorrectAnswer = data.answer || "";
        officialSolutionUrl = data.solutionUrl || "solution.jpg";
        
        // 문제 이미지 업데이트
        if (data.problemUrl) {
          document.getElementById("problemImage").src = data.problemUrl;
        }
        // 풀이 이미지 업데이트
        if (officialSolutionUrl) {
          document.getElementById("officialSolutionImg").src = officialSolutionUrl;
        }
      }
    });

    // 💡 갤러리 접기/펴기 기능
    window.toggleGallery = function() {
      const gallery = document.getElementById("gallery");
      const btn = document.getElementById("toggleGalleryBtn");
      
      if (gallery.classList.contains("hidden")) {
        gallery.classList.remove("hidden");
        btn.innerText = "🙈 풀이 숨기기";
        btn.classList.replace("bg-indigo-50", "bg-slate-100");
        btn.classList.replace("text-indigo-600", "text-slate-600");
      } else {
        gallery.classList.add("hidden");
        btn.innerText = "👁️ 풀이 열기";
        btn.classList.replace("bg-slate-100", "bg-indigo-50");
        btn.classList.replace("text-slate-600", "text-indigo-600");
      }
    };

    // 💡 관리자 패널 접기/펴기
    window.toggleAdminPanel = function() {
      const panel = document.getElementById("adminPanel");
      panel.classList.toggle("hidden");
    };

    // 💡 [선생님 전용] 오늘의 문제 & 정답 등록하기
    window.saveTodayProblem = async function() {
      const inputPw = document.getElementById("adminPw").value.trim();
      const newAnswer = document.getElementById("adminAnswer").value.trim();
      const problemFile = document.getElementById("adminProblemImgFile").files[0];
      const solutionFile = document.getElementById("adminSolutionImgFile").files[0];
      const statusDiv = document.getElementById("adminStatus");

      if (inputPw !== ADMIN_PASSWORD) {
        alert("비밀번호가 일치하지 않습니다!");
        return;
      }

      if (!newAnswer) {
        alert("오늘의 정답을 입력해주세요!");
        return;
      }

      statusDiv.innerHTML = "<p class='text-blue-600 font-bold'>⏳ 데이터 및 이미지를 업로드하는 중입니다...</p>";

      try {
        let problemUrl = document.getElementById("problemImage").src;
        let solutionUrl = officialSolutionUrl;

        // 문제 이미지 첨부 시 Storage 업로드
        if (problemFile) {
          const pRef = ref(storage, `daily_problems/problem_${todayStr}`);
          await uploadBytes(pRef, problemFile);
          problemUrl = await getDownloadURL(pRef);
        }

        // 공식 풀이 이미지 첨부 시 Storage 업로드
        if (solutionFile) {
          const sRef = ref(storage, `daily_solutions/solution_${todayStr}`);
          await uploadBytes(sRef, solutionFile);
          solutionUrl = await getDownloadURL(sRef);
        }

        // Firestore 저장
        await setDoc(doc(db, "settings", "todayProblem"), {
          answer: newAnswer,
          problemUrl: problemUrl,
          solutionUrl: solutionUrl,
          updatedAt: new Date().toISOString()
        });

        statusDiv.innerHTML = "<p class='text-green-600 font-bold'>✅ 성공적으로 오늘의 문제와 정답이 변경되었습니다!</p>";
        document.getElementById("adminAnswer").value = "";
        document.getElementById("adminProblemImgFile").value = "";
        document.getElementById("adminSolutionImgFile").value = "";

      } catch (error) {
        console.error(error);
        statusDiv.innerHTML = "<p class='text-red-500 font-bold'>❌ 저장 중 오류가 발생했습니다.</p>";
      }
    };

    // 2. 실시간 랭킹 및 갤러리 불러오기
    const q = query(collection(db, "rankings"), orderBy("streak", "desc"), limit(15));
    onSnapshot(q, (snapshot) => {
      const leaderboard = document.getElementById("leaderboard");
      const gallery = document.getElementById("gallery");
      leaderboard.innerHTML = "";
      gallery.innerHTML = "";
      
      let rank = 1;
      let hasGalleryImages = false;

      snapshot.forEach((doc) => {
        const data = doc.data();
        
        // 랭킹판 업데이트
        const row = `
          <tr class="border-b hover:bg-slate-50 transition-colors">
            <td class="p-3 font-bold ${rank === 1 ? 'text-amber-500' : 'text-slate-600'}">${rank}위</td>
            <td class="p-3 font-medium text-slate-800">${data.name}</td>
            <td class="p-3 font-bold text-orange-500">🔥 ${data.streak}일</td>
            <td class="p-3 text-slate-500">${data.score}점</td>
          </tr>
        `;
        leaderboard.innerHTML += row;
        rank++;

        // 오늘 문제를 풀었고, 풀이 사진을 올린 친구들의 갤러리 업데이트
        if (data.lastSolvedDate === todayStr && data.solutionImageUrl) {
          hasGalleryImages = true;
          const card = `
            <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
              <p class="font-bold text-indigo-600 mb-2 text-xs">💡 ${data.name}의 풀이</p>
              <img src="${data.solutionImageUrl}" alt="${data.name} 풀이" class="w-full h-auto rounded cursor-pointer hover:opacity-90 object-cover" onclick="window.open('${data.solutionImageUrl}')">
            </div>
          `;
          gallery.innerHTML += card;
        }
      });

      if (!hasGalleryImages) {
        gallery.innerHTML = "<p class='text-slate-400 text-sm col-span-2 text-center py-4'>아직 등록된 친구들의 풀이가 없어요. 첫 번째로 올려보세요!</p>";
      }
    });

    // 3. 학생 정답 제출 처리
    window.submitAnswer = async function() {
      const name = document.getElementById("userName").value.trim();
      const answer = document.getElementById("userAnswer").value.trim();
      const imageFile = document.getElementById("userSolutionImage").files[0];
      const resultDiv = document.getElementById("resultMessage");
      const submitBtn = document.getElementById("submitBtn");

      if (!name || !answer) {
        alert("이름과 정답을 모두 입력해주세요!");
        return;
      }

      if (!currentCorrectAnswer) {
        alert("선생님이 아직 오늘의 문제 정답을 등록하지 않았습니다!");
        return;
      }

      if (answer === currentCorrectAnswer) {
        submitBtn.innerText = "데이터 및 사진 저장 중... ⏳";
        submitBtn.disabled = true;
        submitBtn.classList.add("opacity-50");

        try {
          const userRef = doc(db, "rankings", name);
          const userSnap = await getDoc(userRef);

          let currentScore = 0;
          let newStreak = 1;
          let uploadedImageUrl = null;

          if (userSnap.exists()) {
            const userData = userSnap.data();
            const lastDate = userData.lastSolvedDate;
            
            if (lastDate === todayStr) {
              resultDiv.innerHTML = "<p class='text-blue-600 font-bold bg-blue-50 p-3 rounded-lg'>이미 오늘 문제를 풀었습니다!</p>";
              document.getElementById("solutionArea").classList.remove("hidden");
              submitBtn.innerText = "정답 제출하고 Streak 쌓기 🔥";
              submitBtn.disabled = false;
              submitBtn.classList.remove("opacity-50");
              return;
            }

            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterdayStr = yesterdayDate.toLocaleDateString('sv-SE');

            if (lastDate === yesterdayStr) {
              newStreak = userData.streak + 1;
            } else {
              newStreak = 1;
            }
            currentScore = userData.score || 0;
          }

          // 점수 계산 (기본 10점 + 연속일수 보너스 + 사진 보너스 5점)
          const streakBonus = newStreak - 1;
          const baseScore = 10 + streakBonus;
          let photoBonus = imageFile ? 5 : 0;

          const earnedScore = baseScore + photoBonus;
          const newScore = currentScore + earnedScore;

          let scoreDetailMsg = "기본 10점";
          if (streakBonus > 0) scoreDetailMsg += ` + 🔥 연속 보너스 ${streakBonus}점`;
          if (photoBonus > 0) scoreDetailMsg += ` + 📸 사진 보너스 5점`;

          // 풀이 이미지 업로드
          if (imageFile) {
            const storageRef = ref(storage, `solutions/${todayStr}_${name}`);
            await uploadBytes(storageRef, imageFile);
            uploadedImageUrl = await getDownloadURL(storageRef);
          }

          // Firestore 저장
          await setDoc(userRef, {
            name: name,
            streak: newStreak,
            score: newScore,
            lastSolvedDate: todayStr,
            solutionImageUrl: uploadedImageUrl
          }, { merge: true });

          resultDiv.innerHTML = `<p class='text-green-600 font-bold bg-green-50 p-3 rounded-lg animate-pulse'>
            🎉 정답입니다! 🔥 ${newStreak}일 연속 성공!<br>
            <span class='text-indigo-600 text-xs mt-1 inline-block'>+${earnedScore}점 획득! (${scoreDetailMsg})</span>
          </p>`;

          document.getElementById("solutionArea").classList.remove("hidden");
          
        } catch (error) {
          resultDiv.innerHTML = "<p class='text-red-500 font-bold bg-red-50 p-3 rounded-lg'>오류가 발생했습니다. 다시 시도해주세요.</p>";
          console.error("제출 에러:", error);
        } finally {
          submitBtn.innerText = "정답 제출하고 Streak 쌓기 🔥";
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-50");
        }
      } else {
        resultDiv.innerHTML = "<p class='text-red-500 font-bold bg-red-50 p-3 rounded-lg'>❌ 아쉽네요, 오답입니다.</p>";
        document.getElementById("solutionArea").classList.add("hidden");
      }
    };
  </script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans pb-24">
  <header class="max-w-4xl mx-auto mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-slate-800">우리반 매일 수학 챌린지 🚀</h1>
  </header>
  
  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- 왼쪽: 문제 및 제출 -->
    <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <span class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs">오늘의 문제</span>
        <span id="dateDisplay" class="text-xs font-medium text-slate-500"></span>
      </div>
      
      <div class="my-4">
        <img id="problemImage" src="problem.png" alt="오늘의 수학 문제" class="w-full h-auto rounded-xl border-2 border-slate-100 object-cover shadow-sm">
      </div>
      
      <div class="space-y-4 mt-6">
        <input type="text" id="userName" placeholder="이름을 입력하세요 (예: 10101 홍길동)" class="w-full p-3 bg-slate-50 border rounded-lg text-sm">
        <input type="text" id="userAnswer" placeholder="정답을 입력하세요 (숫자)" class="w-full p-3 bg-slate-50 border rounded-lg text-sm">
        
        <div class="p-3 bg-slate-50 border rounded-lg text-sm">
          <label class="block text-slate-600 font-bold mb-1 text-xs">📸 내 풀이 사진 올리기 (+5점 보너스!)</label>
          <input type="file" id="userSolutionImage" accept="image/*" class="w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <button id="submitBtn" onclick="submitAnswer()" class="w-full bg-indigo-600 text-white font-bold p-3 rounded-lg text-sm transition-all">정답 제출하고 Streak 쌓기 🔥</button>
      </div>
      
      <div id="resultMessage" class="mt-4 text-center text-sm"></div>
      
      <!-- 선생님 공식 풀이 영역 -->
      <div id="solutionArea" class="hidden mt-6 p-5 bg-green-50 rounded-xl border border-green-100">
        <h3 class="text-sm font-bold text-green-700 mb-3">✨ 운영자 공식 풀이</h3>
        <img id="officialSolutionImg" src="solution.jpg" alt="공식 풀이" class="w-full h-auto rounded-lg shadow-sm">
      </div>
    </div>

    <!-- 오른쪽: 랭킹 및 친구들 풀이 갤러리 -->
    <div class="flex flex-col gap-6 h-fit">
      <!-- 랭킹 -->
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4">🏆 실시간 스트릭 랭킹</h2>
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs border-b">
            <tr><th class="p-3">순위</th><th class="p-3">이름</th><th class="p-3">연속</th><th class="p-3">총점</th></tr>
          </thead>
          <tbody id="leaderboard">
            <tr><td colspan="4" class="p-8 text-center text-slate-400">랭킹 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 오늘의 친구들 풀이 -->
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">👨‍🏫 오늘의 친구들 풀이</h2>
          <button id="toggleGalleryBtn" onclick="toggleGallery()" class="text-xs bg-indigo-50 text-indigo-600 font-bold px-3 py-1.5 rounded-lg hover:bg-indigo-100 transition-all cursor-pointer">
            👁️ 풀이 열기
          </button>
        </div>
        <p class="text-xs text-slate-400 mb-4">버튼을 누르면 친구들이 올린 풀이 사진을 볼 수 있습니다.</p>
        
        <div id="gallery" class="grid grid-cols-2 gap-4 hidden border-t pt-4 border-slate-100">
          <p class="text-slate-400 text-sm col-span-2 text-center py-4">데이터를 불러오는 중...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ⚙️ 선생님 전용 관리자 메뉴 (화면 맨 아래) -->
  <footer class="max-w-4xl mx-auto mt-12 pt-6 border-t border-slate-200 text-center">
    <button onclick="toggleAdminPanel()" class="text-xs text-slate-400 hover:text-slate-600 underline cursor-pointer">
      ⚙️ 선생님 전용 관리자 메뉴 열기/접기
    </button>

    <div id="adminPanel" class="hidden mt-4 p-6 bg-slate-800 text-white rounded-2xl text-left shadow-xl max-w-lg mx-auto">
      <h3 class="text-base font-bold mb-4 flex items-center gap-2">🔑 오늘의 문제 및 정답 등록 (선생님 전용)</h3>
      
      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold mb-1 text-slate-300">관리자 비밀번호</label>
          <input type="password" id="adminPw" placeholder="비밀번호 입력 (기본: 1234)" class="w-full p-2.5 bg-slate-700 text-white rounded border border-slate-600 focus:outline-none focus:border-indigo-400">
        </div>

        <div>
          <label class="block font-semibold mb-1 text-slate-300">오늘의 정답 (필수)</label>
          <input type="text" id="adminAnswer" placeholder="예: 12" class="w-full p-2.5 bg-slate-700 text-white rounded border border-slate-600 focus:outline-none focus:border-indigo-400">
        </div>

        <div>
          <label class="block font-semibold mb-1 text-slate-300">오늘의 문제 이미지 파일 (선택)</label>
          <input type="file" id="adminProblemImgFile" accept="image/*" class="w-full text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-slate-600 file:text-white hover:file:bg-slate-500">
        </div>

        <div>
          <label class="block font-semibold mb-1 text-slate-300">공식 풀이 이미지 파일 (선택)</label>
          <input type="file" id="adminSolutionImgFile" accept="image/*" class="w-full text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-slate-600 file:text-white hover:file:bg-slate-500">
        </div>

        <button onclick="saveTodayProblem()" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2.5 rounded transition-all mt-2">
          오늘의 문제 & 정답 등록하기 🚀
        </button>

        <div id="adminStatus" class="mt-2 text-center text-xs"></div>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("dateDisplay").innerText = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  </script>
</body>
</html>
