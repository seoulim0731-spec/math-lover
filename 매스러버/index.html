<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리반 매일 수학 챌린지 🧮</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // 📷 Storage(사진 저장) 기능 추가!
    import { getStorage, ref, uploadBytes, getDownloadURL } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // ⚠️ [여기를 본인의 Firebase 설정값으로 변경하세요] ⚠️
    const firebaseConfig = {

  apiKey: "AIzaSyA7O42ev9D6H8PzLMO6qzR1PeSHXM3JDI8",

  authDomain: "math-lover-d4916.firebaseapp.com",

  projectId: "math-lover-d4916",

  storageBucket: "math-lover-d4916.firebasestorage.app",

  messagingSenderId: "343871778182",

  appId: "1:343871778182:web:a69711224013c9c454d007",

  measurementId: "G-N8KR7D374Y"

};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app); // Storage 초기화

    // 오늘의 날짜 구하기
    // 한국 시간(KST) 기준 날짜 구하기 (YYYY-MM-DD)
    const todayStr = new Date().toISOString().split('T')[0];

    // 실시간 랭킹 및 갤러리 불러오기
    const q = query(collection(db, "rankings"), orderBy("streak", "desc"), limit(15));
    onSnapshot(q, (snapshot) => {
      const leaderboard = document.getElementById("leaderboard");
      const gallery = document.getElementById("gallery");
      leaderboard.innerHTML = "";
      gallery.innerHTML = "";
      
      let rank = 1;
      let hasGalleryImages = false;

      snapshot.forEach((doc) => {
        const data = doc.data();
        
        // 1. 랭킹판 업데이트
        const row = `
          <tr class="border-b hover:bg-slate-50 transition-colors">
            <td class="p-3 font-bold ${rank === 1 ? 'text-amber-500' : 'text-slate-600'}">${rank}위</td>
            <td class="p-3 font-medium text-slate-800">${data.name}</td>
            <td class="p-3 font-bold text-orange-500">🔥 ${data.streak}일</td>
            <td class="p-3 text-slate-500">${data.score}점</td>
          </tr>
        `;
        leaderboard.innerHTML += row;
        rank++;

        // 2. 오늘 문제를 풀었고, 풀이 사진을 올린 친구들의 갤러리 업데이트
        if (data.lastSolvedDate === todayStr && data.solutionImageUrl) {
          hasGalleryImages = true;
          const card = `
            <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
              <p class="font-bold text-indigo-600 mb-2 text-sm">💡 ${data.name}의 풀이</p>
              <img src="${data.solutionImageUrl}" alt="${data.name} 풀이" class="w-full h-auto rounded cursor-pointer hover:opacity-90" onclick="window.open('${data.solutionImageUrl}')">
            </div>
          `;
          gallery.innerHTML += card;
        }
      });

      if (!hasGalleryImages) {
        gallery.innerHTML = "<p class='text-slate-400 text-sm col-span-2 text-center py-4'>아직 등록된 친구들의 풀이가 없어요. 첫 번째로 올려보세요!</p>";
      }
    });

    // 정답 제출
    window.submitAnswer = async function() {
      const name = document.getElementById("userName").value.trim();
      const answer = document.getElementById("userAnswer").value.trim();
      const imageFile = document.getElementById("userSolutionImage").files[0];
      const resultDiv = document.getElementById("resultMessage");
      const submitBtn = document.getElementById("submitBtn");

      if (!name || !answer) {
        alert("이름과 정답을 모두 입력해주세요!");
        return;
      }

      // 💡 매일 여기서 오늘의 정답을 변경하세요
      const correctAnswer = "12"; 
      
      if (answer === correctAnswer) {
        submitBtn.innerText = "데이터 저장 중... 잠시만 기다려주세요 ⏳";
        submitBtn.disabled = true;
        submitBtn.classList.add("opacity-50");

        try {
          const userRef = doc(db, "rankings", name);
          const userSnap = await getDoc(userRef);

          let newStreak = 1;
          let newScore = 10;
          let uploadedImageUrl = null;

          if (userSnap.exists()) {
            const userData = userSnap.data();
            const lastDate = userData.lastSolvedDate;
            
            if (lastDate === todayStr) {
              resultDiv.innerHTML = "<p class='text-blue-600 font-bold bg-blue-50 p-3 rounded-lg'>이미 오늘 문제를 풀었습니다!</p>";
              document.getElementById("solutionArea").classList.remove("hidden");
              submitBtn.innerText = "정답 제출하고 Streak 쌓기 🔥";
              submitBtn.disabled = false;
              submitBtn.classList.remove("opacity-50");
              return;
            }

            const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
            if (lastDate === yesterday) {
              newStreak = userData.streak + 1;
            } else {
              newStreak = 1;
            }
            // 🌟 점수 계산: 기본 정답 10점 + 사진 보너스 5점
          let earnedScore = 10;
          let bonusMessage = "";
          
          if (imageFile) {
            earnedScore += 5; // 보너스 추가
            bonusMessage = "📸 풀이 공유 보너스 +5점!";
          }
          let newScore = currentScore + earnedScore;
          }

          // 📷 사진 파일이 있으면 Firebase Storage에 업로드
          if (imageFile) {
            const storageRef = ref(storage, `solutions/${todayStr}_${name}`);
            await uploadBytes(storageRef, imageFile);
            uploadedImageUrl = await getDownloadURL(storageRef); // 업로드된 사진 링크 가져오기
          }

          // Firestore에 데이터 저장 (사진 링크 포함)
          await setDoc(userRef, {
            name: name,
            streak: newStreak,
            score: newScore,
            lastSolvedDate: todayStr,
            solutionImageUrl: uploadedImageUrl // 사진 안 올렸으면 null로 저장됨
          }, { merge: true });

          resultDiv.innerHTML = `<p class='text-green-600 font-bold bg-green-50 p-3 rounded-lg animate-pulse'>🎉 정답입니다! 🔥 ${newStreak}일 연속 성공!</p>`;
          document.getElementById("solutionArea").classList.remove("hidden");
          
        } catch (error) {
          resultDiv.innerHTML = "<p class='text-red-500 font-bold bg-red-50 p-3 rounded-lg'>오류가 발생했습니다. 다시 시도해주세요.</p>";
          console.error(error);
        } finally {
          submitBtn.innerText = "정답 제출하고 Streak 쌓기 🔥";
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-50");
        }
      } else {
        resultDiv.innerHTML = "<p class='text-red-500 font-bold bg-red-50 p-3 rounded-lg'>❌ 아쉽네요, 오답입니다.</p>";
        document.getElementById("solutionArea").classList.add("hidden");
      }
    };
  </script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 font-sans">
  <header class="max-w-4xl mx-auto mb-8 text-center">
    <h1 class="text-3xl font-extrabold text-slate-800">우리반 매일 수학 챌린지 🚀</h1>
  </header>
  
  <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- 왼쪽: 문제 및 제출 -->
    <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <span class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs">오늘의 문제</span>
        <span id="dateDisplay" class="text-xs font-medium text-slate-500"></span>
      </div>
      
      <div class="my-4">
        <!-- 💡 매일 문제 사진 교체하는 곳 -->
        <img src="problem.png" alt="오늘의 수학 문제" class="w-full h-auto rounded-xl border-2 border-slate-100 object-cover shadow-sm">
      </div>
      
      <div class="space-y-4 mt-6">
        <input type="text" id="userName" placeholder="이름을 입력하세요 (예: 홍길동)" class="w-full p-3 bg-slate-50 border rounded-lg text-sm">
        <input type="text" id="userAnswer" placeholder="정답을 입력하세요 (숫자)" class="w-full p-3 bg-slate-50 border rounded-lg text-sm">
        
        <!-- 📷 내 풀이 사진 업로드 추가 -->
        <div class="p-3 bg-slate-50 border rounded-lg text-sm">
          <label class="block text-slate-600 font-bold mb-1 text-xs">📸 내 풀이 사진 올리기 (선택)</label>
          <input type="file" id="userSolutionImage" accept="image/*" class="w-full text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <button id="submitBtn" onclick="submitAnswer()" class="w-full bg-indigo-600 text-white font-bold p-3 rounded-lg text-sm transition-all">정답 제출하고 Streak 쌓기 🔥</button>
      </div>
      
      <div id="resultMessage" class="mt-4 text-center text-sm"></div>
      
      <!-- 선생님(운영자) 공식 풀이 -->
      <div id="solutionArea" class="hidden mt-6 p-5 bg-green-50 rounded-xl border border-green-100">
        <h3 class="text-sm font-bold text-green-700 mb-3">✨ 운영자 공식 풀이</h3>
        <!-- 💡 매일 풀이 사진 교체하는 곳 -->
        <img src="solution.jpg" alt="공식 풀이" class="w-full h-auto rounded-lg shadow-sm">
      </div>
    </div>

    <!-- 오른쪽: 랭킹 및 친구들 풀이 갤러리 -->
    <div class="flex flex-col gap-6 h-fit">
      <!-- 랭킹 -->
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4">🏆 실시간 스트릭 랭킹</h2>
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs border-b">
            <tr><th class="p-3">순위</th><th class="p-3">이름</th><th class="p-3">연속</th><th class="p-3">총점</th></tr>
          </thead>
          <tbody id="leaderboard">
            <tr><td colspan="4" class="p-8 text-center text-slate-400">랭킹 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>

      <!-- 친구들 풀이 갤러리 추가! -->
      <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">👨‍🏫 오늘의 친구들 풀이</h2>
        <div id="gallery" class="grid grid-cols-2 gap-4">
          <!-- 갤러리 사진이 여기에 뜹니다 -->
          <p class="text-slate-400 text-sm col-span-2 text-center py-4">데이터를 불러오는 중...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("dateDisplay").innerText = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  </script>
</body>
</html>
